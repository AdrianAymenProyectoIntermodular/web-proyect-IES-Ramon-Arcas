server {
    listen 80;
    server_name localhost;
    client_max_body_size 8m;

    # Toda la API pasa por el front controller PHP
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass php:9000;
    }

    location = /health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI /health;
        fastcgi_pass php:9000;
    }

    # Uploads estaticos: nunca ejecutar PHP en esta carpeta
    location /storage/uploads/ {
        alias /var/www/api/storage/uploads/;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    # Frontend (web/dist, generado con `npm run build`). SPA: rutas desconocidas -> index.html.
    root /var/www/web;

    # Ficheros con hash en el nombre: cacheables indefinidamente
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html sin caché para que cada despliegue apunte a los assets nuevos
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # `=404` si aún no se ha compilado el front (evita bucle de redirecciones internas)
    location / {
        try_files $uri /index.html =404;
    }
}
